name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Podpis (opcjonalny - sekrety repozytorium)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/guard.p12"; echo "KEYSTORE_FILE=$RUNNER_TEMP/guard.p12" >> "$GITHUB_ENV"; fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: aurora-guard-debug, path: app/build/outputs/apk/debug/*.apk }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "aurora-guard-$VER.apk"
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" "aurora-guard-$VER.apk" --title "Aurora Guard $VER" --notes-file notes.md
